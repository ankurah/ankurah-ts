[paths]
rust_source = "../ankurah-ts-support"
ts_target = ".."

[crates]
ankql = "ankql"
"ankurah-proto" = "proto"
"ankurah-signals" = "signals"
"ankurah-core" = "core"
"ankurah-storage-common" = "storage-common"
"ankurah-storage-sqlite" = "storage-sqlite"
"ankurah-storage-postgres" = "storage-postgres"
"ankurah-storage-indexeddb-wasm" = "storage-indexeddb"
"ankurah-websocket-client" = "connector-websocket"
"ankurah-websocket-server" = "connector-websocket-server"
"ankurah-connector-local-process" = "connector-local"
"ankurah" = "ankurah"

[features]
# Features enabled for transpilation. cfg() expressions are evaluated against this.
# JS/TS is single-threaded, so we use the singlethread codepath.
enabled = ["singlethread"]

[excluded_files]
# Feature-gated or out-of-scope files
files = [
  "proto/src/postgres.rs",
  "signals/src/react.rs",
  "signals/src/react_native.rs",
  "signals/src/jsvalue.rs",
]

[name_overrides]
fmt = "toString"
serialize = "encode"
deserialize = "decode"
eq = "equals"
default = "default"
drop = "drop"
new = "new"
from = "from"

[provided_impls]
# Custom impl Serialize/Deserialize (raw bytes + base64) — not derive-based
# TODO: transpilable if we add (1) base64.provided.ts module, (2) provided_redirect
# for base64 crate, (3) transpiler support for custom impl Serialize (not just derive)
"ankurah_proto::id::EntityId" = { path = "id.provided" }
"ankurah_proto::data::EventId" = { path = "id.provided" }

# Ulid wrappers — depend on ULID generation/encoding infrastructure
# TODO: transpilable by mapping Ulid→string in name_map + providing Ulid utility
# class with new()/fromParts(). Serde would work since Ulid serializes as string.
"ankurah_proto::transaction::TransactionId" = { path = "id.provided" }
"ankurah_proto::request::RequestId" = { path = "id.provided" }
"ankurah_proto::subscription::QueryId" = { path = "id.provided" }
"ankurah_proto::update::UpdateId" = { path = "id.provided" }

# Complex method bodies (binary_search, try_into, iterator combinators)
# TODO: transpilable if we add binary_search utility + translate try_into patterns.
# The struct/serde itself is trivial (Vec<EventId>), only the methods are complex.
"ankurah_proto::clock::Clock" = { path = "clock.provided" }

# Error types — callers in provided impls use factory methods (DecodeError.invalidLength())
# TODO: transpilable once we either (1) generate Enum static factories per variant,
# or (2) update all callers to use new DecodeError('InvalidLength', {}) constructor.
# Also needs fix for base64::DecodeError→DecodeError name collision in InvalidBase64 variant.
"ankurah_proto::error::DecodeError" = { path = "error.provided" }
"ankurah_proto::error::IdParseError" = { path = "error.provided" }

# Generic type requires callback-based encode/decode
# TODO: transpilable if transpiler detects generic type params in Serialize/Deserialize
# derives and generates callback-based encode/decode automatically.
"ankurah_proto::auth::Attested" = { path = "auth.provided" }

[provided_redirect.yrs]
source_crate = "yrs"
target_module = "@ankurah/base/yrs-compat"
types = { "Doc" = "YrsDoc", "Text" = "YrsText", "Map" = "YrsMap" }

[hardcode]
# Files with no syntactic correspondence — transpiler preserves existing TS
files = [
  "ankql/src/parser.rs",
  "ankql/src/grammar.rs",
  # TODO: transpilable if we add .chunks()/.fold() iterator translations
  "proto/src/human_id.rs",
  # Complex recursive tree-walking methods, pattern matching on multiple variants
  # TODO: transpilable with better body translation for recursive enums
  "ankql/src/ast.rs",
  "ankql/src/selection/sql.rs",
  "ankql/src/lib.rs",
  "signals/src/lib.rs",
]

[cross_crate_types]
# Types from other crates accessed via module-level imports (use ankql::ast)
# TODO: auto-detect from use statements + type path analysis
Selection = "@ankurah/ankql"

# ── System types ──────────────────────────────────────────────────────
# Foundational runtime types from @ankurah/base/std/. They are declared into
# the registry's reserved system module, so a crate type with the same leaf
# name shadows them exactly where Rust says it does and never displaces them.
# Distinct from [provided_impls] (subject-code types in *.provided.ts).
#
# Every signature here is written as Rust and parsed by syn — the same door the
# std-surface step uses once these entries become signature-only Rust stub
# files. The signatures describe the polyfill in @ankurah/base, which is why
# Mutex::lock yields the guard rather than a LockResult.
#
# Methods that return an iterator are absent: `slice::Iter` needs associated
# types, which arrive with the std surface.

[system_types.Arc]
path = "std::sync::Arc"
deref_field = "value"
type_params = ["T"]
methods = { clone = "Arc<T>", downgrade = "Weak<T>" }

[system_types.Weak]
path = "std::sync::Weak"
type_params = ["T"]
methods = { upgrade = "Option<Arc<T>>", clone = "Weak<T>" }

[system_types.Mutex]
path = "std::sync::Mutex"
type_params = ["T"]
methods = { lock = "MutexGuard<T>" }

[system_types.MutexGuard]
path = "std::sync::MutexGuard"
deref_field = "value"
type_params = ["T"]

[system_types.RwLock]
path = "std::sync::RwLock"
type_params = ["T"]
methods = { read = "RwLockReadGuard<T>", write = "RwLockWriteGuard<T>" }

[system_types.RwLockReadGuard]
path = "std::sync::RwLockReadGuard"
deref_field = "value"
type_params = ["T"]

[system_types.RwLockWriteGuard]
path = "std::sync::RwLockWriteGuard"
deref_field = "value"
type_params = ["T"]

[system_types.RefCell]
path = "std::cell::RefCell"
type_params = ["T"]
methods = { borrow = "Ref<T>", borrow_mut = "RefMut<T>" }

[system_types.Ref]
path = "std::cell::Ref"
deref_field = "value"
type_params = ["T"]

[system_types.RefMut]
path = "std::cell::RefMut"
deref_field = "value"
type_params = ["T"]

[system_types.Box]
path = "std::boxed::Box"
deref_field = ""  # transparent — unwrap to inner type, emit nothing
type_params = ["T"]

# Option and String are declared so that resolution can name them. Option's
# methods replace the nullable special case the old registry hard-coded.
[system_types.Option]
path = "std::option::Option"
type_params = ["T"]
methods = { unwrap = "T", expect = "T", is_some = "bool", is_none = "bool" }

[system_types.String]
path = "std::string::String"

[system_types.Result]
path = "std::result::Result"
type_params = ["T", "E"]
methods = { unwrap = "T", expect = "T", is_ok = "bool", is_err = "bool" }

[system_types.Vec]
path = "std::vec::Vec"
type_params = ["T"]
methods = { len = "usize", push = "()", pop = "Option<T>", clone = "Vec<T>" }

[system_types.HashMap]
path = "std::collections::HashMap"
type_params = ["K", "V"]
methods = { get = "Option<&V>", insert = "Option<V>", len = "usize", contains_key = "bool" }

[system_types.BTreeMap]
path = "std::collections::BTreeMap"
type_params = ["K", "V"]
methods = { get = "Option<&V>", insert = "Option<V>", len = "usize", contains_key = "bool" }

[system_types.HashSet]
path = "std::collections::HashSet"
type_params = ["T"]
methods = { insert = "bool", contains = "bool", len = "usize" }

[system_types.BTreeSet]
path = "std::collections::BTreeSet"
type_params = ["T"]
methods = { insert = "bool", contains = "bool", len = "usize" }

# The port models `thread_local!` as a ThreadLocal<T> value; Rust's name for
# what the macro declares is `std::thread::LocalKey`, and that is the path a
# written type reaches it by.
[system_types.ThreadLocal]
path = "std::thread::LocalKey"
type_params = ["T"]

# Atomics are plain numbers in single-threaded JavaScript. Declared so that the
# native-type translations recognise them by identity rather than by name.
[system_types.AtomicUsize]
path = "std::sync::atomic::AtomicUsize"

[system_types.AtomicU32]
path = "std::sync::atomic::AtomicU32"

[system_types.AtomicBool]
path = "std::sync::atomic::AtomicBool"

[system_types.Infallible]
path = "std::convert::Infallible"

[managed_files]
# Phase 3: files the transpiler owns (start empty, grow gradually)
