[package]
name = "ankurah-transpile"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit", "clone-impls", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
toml = "0.8"

# Test-only. The shipped binary depends on none of these.
[dev-dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse"] }
